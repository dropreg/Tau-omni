### model
model_name_or_path: /workspace/mnt/lxb_work/hf_dir/hf_model/Qwen/Qwen3-8B
# /workspace/mnt/lxb_work/hf_dir/hf_model/Qwen/Qwen3-VL-8B-Instruct
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
deepspeed: /workspace/mnt/lxb_work/LLaMA-Factory/examples/deepspeed/ds_z3_config.json


dataset: grm_sft
# template: qwen3_vl
template: qwen
# template: llama3
cutoff_len: 20480
max_samples: 40000
overwrite_cache: true
preprocessing_num_workers: 64
dataloader_num_workers: 0

### output
output_dir: data/ckpt/grm_sft
logging_steps: 5
save_steps: 150
plot_loss: true
overwrite_output_dir: true
save_only_model: false

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
