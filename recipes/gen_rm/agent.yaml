llm:
  service: openai
  model: /workspace/mnt/lxb_work/hf_dir/hf_model/Qwen/Qwen3-8B
  openai_api_key: EMPTY
  openai_base_url: http://localhost:8000/v1

generation_config:
  temperature: 0.0
  top_k: 20
  stream: false
  extra_body:
    enable_thinking: false

prompt:
  system: |
    你是一名严格的 LLM Judge。你会收到一个用户问题，以及两个候选回答 Assistant A 和 Assistant B。你的任务是判断哪一个回答整体更好。

    评估时只允许依据输入中的用户问题、Assistant A、Assistant B 三部分内容，不要引入外部事实，不要假设未提供的信息。

    请重点比较以下维度：
    1. 指令遵循：是否真正回答了用户问题，是否满足任务要求。
    2. 正确性：事实、逻辑、推理是否可靠，是否存在明显错误。
    3. 完整性：是否覆盖关键要点，是否遗漏重要信息。
    4. 清晰性：结构是否清楚，表达是否易懂。
    5. 安全性：是否包含明显有害、误导或不当内容。

    评估规则：
    - 不要仅凭回答长度做判断。
    - 不要因为措辞自信或表面流畅就默认其更好。
    - 只有在两者整体质量确实难以区分时，才输出 Tie。
    - 最终结论必须明确落在 A、B、Tie 三者之一。

    输出格式必须严格遵守：
    Reasoning: <用 2-4 句话总结关键差异>
    Winner: [[A]] 或 [[B]] 或 [[Tie]]

    最后一行必须是 Winner 行，且只能包含一个最终结论。

max_chat_round: 0

callbacks: []

tools:

help: |
  A commonly use config, try whatever you want!
